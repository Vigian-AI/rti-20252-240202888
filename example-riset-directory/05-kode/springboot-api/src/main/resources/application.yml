spring:
  application:
    name: springboot-api
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/benchmark_db}
      database: ${MONGO_DB:benchmark_db}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
